name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxi-dev libxtst-dev libxrandr-dev libxfixes-dev
      - name: Build Linux
        run: |
          cd linux
          npm install
          npm run build:helper
          npm run dist
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: HalawahomDesk-Linux
          path: linux/dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build Windows
        run: |
          cd windows
          npm install
          npm run build:helper
          npm run dist
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: HalawahomDesk-Windows
          path: windows/dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: HalawahomDesk-Android
          path: android/app/build/outputs/apk/debug/*.apk
